services:
  - type: web
    name: tracerisk
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: TINYFISH_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: NODE_OPTIONS
        value: '--dns-result-order=ipv4first'
